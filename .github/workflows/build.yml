name: Build and check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the build tools
        run: pip install -r requirements.txt

      - name: Build fonts and specimen
        run: sources/build.sh

      - name: Install the checkers (separate environment)
        run: |
          python -m venv qa
          qa/bin/pip install -r requirements-qa.txt

      - name: FontBakery (Google Fonts profile for Rondel, universal for Ring and Coin)
        run: |
          qa/bin/fontbakery check-googlefonts -x fontbakery_version --html fb-rondel.html --ghmarkdown fb-rondel.md fonts/ttf/Rondel-Regular.ttf
          qa/bin/fontbakery check-universal -x fontbakery_version --html fb-ring.html --ghmarkdown fb-ring.md fonts/ttf/RondelRing-Regular.ttf
          qa/bin/fontbakery check-universal -x fontbakery_version --html fb-coin.html --ghmarkdown fb-coin.md fonts/ttf/RondelCoin-Regular.ttf

      - name: Add the reports to the run summary
        if: always()
        run: cat fb-*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rondel-build
          path: |
            fonts/
            documentation/specimen/
            fb-*.html
