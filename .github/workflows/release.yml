name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package the committed fonts
        run: |
          VER="${GITHUB_REF_NAME#v}"
          DIR="Rondel-$VER"
          mkdir -p "$DIR"
          cp -r fonts/ttf fonts/webfonts OFL.txt "$DIR"/
          cp documentation/specimen/index.html "$DIR/Rondel-Specimen.html"
          zip -qr "$DIR.zip" "$DIR"
          echo "ZIP=$DIR.zip" >> "$GITHUB_ENV"
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" "$ZIP"
          --title "Rondel $VER"
          --notes-file .github/release-notes.md
